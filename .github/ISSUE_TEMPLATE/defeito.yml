name: Relatar defeito
description: Algo não funciona como deveria
title: '[Defeito] '
labels: [defeito]
body:
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu?
      description: Descreva o problema e o que você esperava que acontecesse.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Acesse...
        2. Clique em...
        3. Veja o erro...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Área do sistema
      options: [Portal público, Painel de gestão, Acessibilidade, Outra]
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador e dispositivo
      placeholder: 'Ex.: Chrome 130 no Android'
  - type: textarea
    id: anexos
    attributes:
      label: Capturas de tela
      description: 'Atenção: não envie imagens com dados pessoais de moradores.'
